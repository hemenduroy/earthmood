name: Deploy to Vercel and Supabase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Force run Supabase migrations'
        required: true
        type: boolean
        default: true
      run_deployment:
        description: 'Force run Vercel deployment'
        required: true
        type: boolean
        default: true

jobs:
  changes:
    name: Detect Changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'supabase/migrations/**'
              - 'supabase/schema.sql'
            frontend:
              - 'frontend/**'
              - 'vercel.json'
              - 'package.json'
              - 'package-lock.json'


  migrate:
    name: Apply Supabase Migrations
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == true) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm run install:all
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to Supabase project
        run: supabase link --project-ref tawtlsvtauctolorzrft
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply database migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-frontend-only:
    name: Deploy to Vercel (Frontend Only)
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deployment == true) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.backend == 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm run install:all
      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  deploy-with-migration:
    name: Deploy to Vercel (With Migration)
    needs: [changes, migrate]
    if: |
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.backend == 'true' && needs.migrate.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm run install:all
      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod' 